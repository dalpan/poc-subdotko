<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Research PoC</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: #f5f5f5;
      font-family: "Courier New", monospace;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .poc {
      padding: 30px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 64px);
      letter-spacing: 2px;
      margin-bottom: 18px;
    }

    .target {
      color: #888;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .researcher {
      font-size: 18px;
      letter-spacing: 3px;
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 18px;
      background: #f5f5f5;
      vertical-align: middle;
      margin-left: 5px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <main class="poc">
    <h1>SUBDOMAIN TAKEOVER</h1>

    <div class="researcher">
      PoC by Van<span class="cursor"></span>
    </div>
  </main>
</body>
</html>
